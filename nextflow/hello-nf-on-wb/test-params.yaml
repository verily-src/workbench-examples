# Example params file (optional).
#
# The pipeline already defaults to the bundled data/greetings.csv (anchored to
# the pipeline directory), so you do NOT need this file to run.
#
# Use it to point at your own data. Locally, a path relative to where you launch
# works:
input: "data/greetings.csv"
outdir: "results"

# On Workbench (-profile verily_workbench), use gs:// URIs (a relative path won't
# resolve). The Workflows UI lists params files from a *bucket resource*, not this
# repo, so upload your params file too. See the README "Run it on Workbench"
# sections. Example (workDir is set for you by the UI):
# outdir:   "gs://<your-bucket>/hello-nf-on-wb/results"
# input:    "gs://<your-bucket>/inputs/greetings.csv"   # optional; omit to use bundled sample
# location: "us-central1"                               # optional; must match your workspace region
