services:
  app:
    container_name: application-server
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    user: jupyter
    restart: unless-stopped
    volumes:
      - nextflow-home:/home/jupyter
    ports:
      - "8888:8888"
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined

networks:
  app-network:
    external: true

volumes:
  nextflow-home:
